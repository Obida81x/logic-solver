kind = "web"
previewPath = "/"
title = "Logic Circuit Solver"
version = "1.0.0"
id = "artifacts/logic-solver"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23616

[services.development]
run = "pnpm --filter @workspace/logic-solver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logic-solver", "run", "build" ]
publicDir = "artifacts/logic-solver/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23616"
BASE_PATH = "/"
